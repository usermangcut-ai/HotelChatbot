# CI: mỗi lần push/PR → chạy test backend + frontend và build thử Docker image.
# Railway tự deploy khi main có commit mới; bật "Wait for CI" trong Railway để chỉ deploy khi CI xanh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t khaifrost:ci .
      - name: Smoke test (container lên được, /api/health trả 200)
        run: |
          docker run -d --name app -e PORT=8000 -p 8000:8000 khaifrost:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1

  # CD: CI xanh trên main → đẩy code lên Railway bằng Railway CLI (không cần app GitHub của Railway).
  # Cần secret RAILWAY_TOKEN = Project Token (Railway → Project Settings → Tokens, môi trường production).
  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SVC_ID: 992936aa-5950-445a-ae71-c93e5ef6874f   # service HotelChatbot (project ravishing-warmth)
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "Chưa có secret RAILWAY_TOKEN — bỏ qua deploy"; exit 0; fi
          railway up --service="$SVC_ID" --ci
